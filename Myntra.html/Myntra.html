<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Myntra wireframe</title>

        <style>

            table{
                  width: 70%;
                  margin: auto;
                  border-collapse: collapse;

            }
            tr,
            td {
                border: 2px solid black;
                margin: auto;
                border-collapse: collapse;
                margin-top: 5px;
                font-size: 20px;
            }

            td {
                border: 2px solid black;
                text-align: center;
            }

            .box{
                height: 50px;
            }

            .small-box{
                width: 100px;
            }

            .medium-box{
                width: 200px;
            }

            .big-box{
                width: 250px;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td class="box">Logo</td>
                <td class="box">Men</td>
                <td class="box">Women</td>
                <td class="box">Kids</td>
                <td class="box">Home</td>
                <td class="box">Beauty</td>
                <td class="box">Genz</td>
                <td class="box">Studio</td>
                <td class="box" width="60%">Search</td>
                <td class="box">profile</td>
                <td class="box">wishlist</td>
                <td class="box">bag</td>
            </tr>
        </table>

        <table>
            <tr>
                <td class="medium-box" height="300">Banner</td>
            </tr>
        </table>

        <table>
            <tr>
                <td class="big-box" height="300">Banner-1</td>
            </tr>
        </table>

        <table>
            <tr>
                <td class="medium-box" height="300">Banner</td>
            </tr>
        </table>

        <table>
            <tr>
                <td class="small-box" height="100">Product-1</td>
                <td class="small-box" height="100">Product-2</td>
                <td class="small-box" height="100">Product-3</td>
                <td class="small-box" height="100">Product-4</td>
                <td class="small-box" height="100">Product-5</td>
                <td class="small-box" height="100">Product-6</td>
            </tr>
        </table>

        <table>
            <tr>
                <td class="medium-box" height="300">Footer</td>
            </tr>
        </table>
    </body>
</html>
