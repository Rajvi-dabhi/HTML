<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flipcart wireframe</title>

        <style>

            table {
                width: 70%;
                margin: auto;
                border-collapse: collapse;
            }
            th,
            td {
                border: 2px solid black;
                margin: auto;
                border-collapse: collapse;
                margin-top: 5px;
                font-size: 20px;
            }
            td {
                border: 2px solid black;
                text-align: center;
            }

            .box {
                height: 50px;
            }

            .small-box {
                height: 100px;
            }

            .medium-box {
                height: 200px;
            }

            .big box {
                height: 250px;
            }
            
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td class="box" width="15%">logo</td>
                <td class="box" width="15%">Travel</td>
                <td class="box" width="70%">Location</td>
            </tr>
        </table>

        <table>
        <tr>
            <td class="box" width="60%">search</td>
            <td>Login</td>
            <td>More</td>
            <td>Cart</td>
        </tr>
        </table>

        <table>
            <tr>
                <td class="box">For you</td>
                <td class="box">Fasion</td>
                <td class="box">Mobile</td>
                <td class="box">Electronics</td>
                <td class="box">Beauty</td>
                <td class="box">Home</td>
                <td class="box">Appliances</td>
                <td class="box">Toys</td>
                <td class="box">Food</td>
                <td class="box">Auto Mobile</td>
                <td class="box">Sports</td>
                <td class="box">Furniture</td>
                <td class="box">Books</td>
                <td class="box">2 wheeler</td>
            </tr>
        </table>

        <table>
            <tr>
                <td class="medium-box" >Banner</td>
            </tr>
        </table>

        <table>
            <tr>
                <td>Banner-1</td>
                <td>Banner-2</td>
                <td>Banner-3</td>
            </tr>
        </table>

        <table>
            <tr>
                <td class="small-box">Product-1</td>
                <td class="small-box">Product-2</td>
                <td class="small-box">Product-3</td>
                <td class="small-box">Product-4</td>
            </tr>
        </table>

        <table>
            <tr>
                <td class="medium-box" height="200">Flight</td>
            </tr>
        </table>

        <table>
            <tr>
                <td class="medium-box" height="200">Footer</td>
            </tr>
        </table>


    </body>
</html>
